name: Checks

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  move:
    name: Move — spec & schema checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck (every spec satisfies ComponentSpec)
        run: npm run typecheck --workspace move
      - name: Lint (errors fail; complexity rules warn)
        run: npm run lint --workspace move
      - name: Format check (Prettier)
        run: npm run format:check --workspace move
      - name: Drift checks (spec ↔ source, cross-component, families)
        run: npm run check:all --workspace move
      - name: Tests
        run: npm run test --workspace move

  docs:
    name: Docs — dogfood conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck --workspace docs
      # The docs app is a Move app — it runs the same conformance audit on itself.
      # Ratchet mode: the baseline is the accepted debt; any NEW hand-rolling fails.
      - name: Conformance ratchet (no new hand-rolling above the baseline)
        run: npm run check:conformance --workspace docs

  browser:
    name: Move — browser invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Real-browser invariant tests (FLIP, sliding indicator) — things jsdom
      # can't see (layout/paint/rAF). Needs the matching Chromium build.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser invariants
        run: npm run test:browser --workspace move
